# Entry for the IngeTrazo extension catalog
# (https://github.com/ingelibre/ingetrazo-extensions).
#
# Copy this file to that repository as `extensions/igz_toolbars.toml` and open
# a pull request. The `sha256` below is the fingerprint of the exact archive
# built by `packaging/build_extension.ps1` / `packaging/build_extension.py`
# and uploaded as the `v1.5.2` GitHub Release asset named `igz_tb_toolbar.zip`.
# If you rebuild the archive, replace `sha256` with the new value the build
# script prints (or let the automatic check tell you the right one).
#
# Note: `id` stays `igz_toolbars` to keep this entry distinct in the catalog
# that already published v1.4.0 under that id; the packaged folder inside the
# archive is `igz_tb_toolbar/` (it installs into <plugins>/igz_tb_toolbar/).

id = "igz_toolbars"
version = "1.5.2"
author = "Ezequiel M. Rezende"
author_url = "https://github.com/em-rezende"
license = "GPL-3.0-or-later"
repository = "https://github.com/em-rezende/Ingetrazo-igz-toolbars"
download = "https://github.com/em-rezende/Ingetrazo-igz-toolbars/releases/download/v1.5.2/igz_tb_toolbar.zip"
sha256 = "bdd84b5c98bf500ac2bf2612764c0f729405bd232a1f81dc25e279e3ce49ed42"
ingetrazo = "0.5.7"
tags = ["rendering", "drawing", "terrain", "productivity"]
screenshot = "igz_toolbars.png"

[name]
es = "Barras de estilos, sombras y mapa"
en = "Styles, Shadows and Map toolbars"
pt = "Barras de estilos, sombras e mapa"

[summary]
es = "Tres barras inspiradas en SketchUp: estilos replica el menú Cámara ▸ Estilo con 13 botones; sombras añade un interruptor y deslizadores de fecha, hora e intensidad; mapa reúne la fuente de tiles, la ubicación y la carga del mapa."
en = "Three SketchUp-inspired toolbars: Styles mirrors the Camera ▸ Style menu with 13 buttons; Shadows adds a toggle and date, time and intensity sliders; Map gathers the tile source and loads the map."
pt = "Três barras inspiradas no SketchUp: estilos espelha o menu Câmera ▸ Estilo com 13 botões; sombras traz um botão e sliders de data, hora e intensidade; mapa reúne a fonte de tiles e carrega o mapa."

[description]
es = "Tres barras de la ventana principal, inspiradas en SketchUp, para trabajar con los estilos de visualización, las sombras y el terreno sin recorrer el menú Cámara: la de estilos replica Cámara ▸ Estilo con 13 botones (los estilos de visualización y el interruptor de rayos X), la de sombras añade un interruptor general y deslizadores de fecha, hora e intensidad, y la de mapa reúne la fuente de tiles, la localización del proyecto y la carga del mapa del panel Terreno."
en = "Three main-window toolbars, inspired by SketchUp, for working with display styles, shadows and terrain without walking the Camera menu: the Styles one mirrors Camera ▸ Style with 13 buttons (the display styles and the X-ray toggle), the Shadows one adds a master switch plus date, time and intensity sliders, and the Map one gathers the tile source, the project location and the map loading of the Terreno panel."
pt = "Três barras da janela principal, inspiradas no SketchUp, para trabalhar com os estilos de visualização, as sombras e o terreno sem percorrer o menu Câmera: a de estilos espelha Câmera ▸ Estilo com 13 botões (os estilos de visualização e o botão de raios X), a de sombras traz um interruptor geral e sliders de data, hora e intensidade, e a de mapa reúne a fonte de tiles, a localização do projeto e o carregamento do mapa do painel Terreno."
