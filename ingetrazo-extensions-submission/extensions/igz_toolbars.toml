license = "GPL-3.0-or-later"
repository = "https://github.com/em-rezende/Ingetrazo-igz-toolbars"
download = "https://github.com/em-rezende/Ingetrazo-igz-toolbars/releases/download/v1.5.1/igz_tb_toolbar.zip"
sha256 = "ad3ffed2a2f9af276c7499afee35e98bc92fa8ae5811c4aead26687203cd3eee"
ingetrazo = "0.5.7"
tags = ["rendering", "drawing", "productivity"]
screenshot = "igz_toolbars.png"

[name]
es = "Barras de estilos y sombras"
en = "Styles and Shadows toolbars"
pt = "Barras de estilos e sombras"

[summary]
es = "Dos barras inspiradas en SketchUp: la de estilos replica el menú Cámara ▸ Estilo con 13 botones, y la de sombras añade un interruptor y deslizadores de fecha, hora e intensidad."
en = "Two SketchUp-inspired toolbars: the Styles one mirrors the Camera ▸ Style menu with 13 buttons, and the Shadows one adds a toggle plus date, time and intensity sliders."
pt = "Duas barras inspiradas no SketchUp: a de estilos espelha o menu Câmera ▸ Estilo com 13 botões, e a de sombras traz um botão e sliders de data, hora e intensidade."
