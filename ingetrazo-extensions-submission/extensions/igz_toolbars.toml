# Entry for the IngeTrazo extension catalog
# (https://github.com/ingelibre/ingetrazo-extensions).
#
# Copy this file to that repository as `extensions/igz_toolbars.toml` and open
# a pull request. The `sha256` below is the fingerprint of the exact archive
# built by `packaging/build_extension.ps1` / `packaging/build_extension.py`
# and uploaded as the `v1.5.1` GitHub Release asset named `igz_tb_toolbar.zip`.
# If you rebuild the archive, replace `sha256` with the new value the build
# script prints (or let the automatic check tell you the right one).
#
# Note: `id` stays `igz_toolbars` to keep this entry distinct in the catalog
# that already published v1.4.0 under that id; the packaged folder inside the
# archive is `igz_tb_toolbar/` (it installs into <plugins>/igz_tb_toolbar/).

id = "igz_toolbars"
version = "1.5.1"
author = "Ezequiel M. Rezende"
